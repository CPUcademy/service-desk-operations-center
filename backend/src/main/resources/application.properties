spring.config.import=optional:file:./backend/.env[.properties]
spring.application.name=sdoc
server.port=${PORT:8002}

server.error.include-message=never
server.error.include-binding-errors=false
auth.cookie.secure=true
auth.cookie.access.name=sdoc_access
auth.cookie.refresh.name=sdoc_refresh
server.ssl.enabled=false
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

jwt.secret=${JWT_SECRET_SDOC}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.default-redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173}

spring.datasource.url=${SDOC_DB_URL}
spring.datasource.username=${SDOC_DB_USERNAME}
spring.datasource.password=${SDOC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.jdbc.use_cache=false
spring.jpa.properties.hibernate.jdbc.batch_size=0

logging.level.root=WARN
logging.level.com.sdoc.sdoc=INFO
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.error=ERROR